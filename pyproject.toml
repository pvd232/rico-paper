[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rico-paper"
version = "0.0.1"
description = "Guided JAX reimplementation of the RICO MIL and Hopfield models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax==0.12.0.1",
    "numpy>=2,<3",
    "pydantic>=2.13,<3",
    "viper-provenance @ git+https://github.com/pvd232/viper.git@197e6a32655d80b75ad58d41bf686e220bbc110c",
]

[project.optional-dependencies]
cuda13 = ["jax[cuda13]==0.12.0.1"]
dev = ["pyrefly==1.4.0", "pytest>=9,<10", "ruff==0.16.7"]
notebook = ["ipykernel>=7,<8", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
python-version = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
